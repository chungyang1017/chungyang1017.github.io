<style>
/* 歲時記：縱書雜誌（magazine-vertical）的色票、字級、間距。
   這一段從 saijiki/index.html 原樣複製，首頁與攝影誌總覽完全照它。 */
:root{
  color-scheme:light;
  --paper:#eee9df;--ink:#1d1d1d;--muted:#575757;--line:#c5c7c8;
  --spread-rule:#dedede;--card-rule:#cfcfcf;--spine:rgba(0,0,0,.07);--focus:#428bd1;
  --sans:"PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  --serif:"Songti TC","Noto Serif TC",serif;
  --pv-bg:#101214;--pv-ink:#eee;--pv-muted:#d4d6d7;--pv-line:#585b5d;--pv-font:var(--sans);
  --H:max(600px,calc(100svh - 58px));
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans)}
h1,h2,h3,p,figure{margin:0}
a{color:inherit;text-decoration:none}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a:hover,.btn:hover{opacity:.8}
:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.serif{font-family:var(--serif)}
.tcy{text-combine-upright:all;-webkit-text-combine:horizontal}
.v{writing-mode:vertical-rl;text-orientation:mixed}

/* 頂列 */
.topbar{position:sticky;top:0;z-index:5;height:58px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;letter-spacing:.08em}
.topbar a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
.topbar .home{font-family:var(--serif);letter-spacing:.22em}
.topbar nav{display:flex;gap:26px}
.topbar nav a{color:var(--muted)}
.topbar nav a[aria-current="true"]{color:var(--ink)}
.topbar .ctx{color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 跨頁 */
.spread{position:relative;min-height:var(--H);display:flex;flex-direction:row-reverse;align-items:center;justify-content:flex-start;gap:2.4vw;padding:44px 3vw;border-bottom:1px solid var(--spread-rule);overflow-x:clip;scroll-margin-top:58px}
.spread::before{content:"";position:absolute;left:50%;top:24px;bottom:24px;width:1px;background:linear-gradient(transparent,var(--spine) 15%,var(--spine) 85%,transparent);pointer-events:none}
.spread>*{position:relative;z-index:1}
.spread.single{justify-content:center}

/* 直排標題區 */
.head{writing-mode:vertical-rl;text-orientation:mixed;align-self:stretch;flex:none;padding:4px 0}
.masthead h1{font-family:var(--serif);font-size:54px;font-weight:500;letter-spacing:.22em;line-height:1.25;margin-left:16px}
.en{font-size:13px;letter-spacing:.18em;line-height:1.5;color:var(--muted);margin-left:20px}
.period{font-size:15px;letter-spacing:.12em;line-height:1.5;margin-left:44px}
.chapter-no{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.3em;line-height:1.3;margin-left:12px}
.chapter-head .chapter-no,.kan .chapter-no{font-size:40px}
.chapter-date{font-size:15px;letter-spacing:.1em;line-height:1.5;margin-left:10px}
.period+.gap{margin-left:44px}
.chapter-range{font-size:13px;letter-spacing:.1em;line-height:1.5;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:8px 15px;border:1px solid var(--line);background:transparent;font-size:14px;letter-spacing:.1em;cursor:pointer}
.v .btn,.head .btn{padding:15px 8px;min-height:0;min-width:44px}

/* 目次 */
.toc{writing-mode:vertical-rl;text-orientation:mixed;align-self:stretch;display:block;padding:4px 0}
.toc h2{font-size:13px;font-weight:400;letter-spacing:.1em;color:var(--muted);margin-left:12px;padding-top:4px}
.toc h2:not(:first-child){margin-right:44px}
.toc a{display:block;margin-left:12px;padding:4px 0}
.toc a b{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.3em;line-height:1.3}
.toc a span{font-size:13px;letter-spacing:.1em;color:var(--muted)}

/* 卷首（四季） */
.kan{display:flex;flex-direction:row-reverse;align-self:stretch;gap:2.4vw;flex:none}
.kan .vname{writing-mode:vertical-rl;text-orientation:mixed;padding:4px 0}
.kan .vname small{display:block;font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.1em;color:var(--muted);margin-left:12px}
.kan .info{writing-mode:vertical-rl;text-orientation:mixed;padding:4px 0}
.kan .info>*{margin-left:10px}
.haiku{writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.3em;line-height:1.3;flex:none;padding:4px 0;max-height:calc(var(--H) - 96px)}
.haiku span{display:block;margin-left:12px}
.haiku.prose{font-size:15px;letter-spacing:.1em;line-height:1.8;font-weight:400}
.haiku.prose span{display:inline;margin:0}
/* 四季並列：底片接觸印樣。
   教授 2026-11-11 21:30「四季，我不想這樣上下，我想要左右並列」；21:33「類似，四季殘響，那個明信片設計。11 四季合一 底片接觸印樣」；
   21:35「攝影展的訊息不用放上去。我只要設計風格」「但是底色不要黑色的」。
   樣子來源：/Volumes/Extreme SSD/攝影展/Design.pdf 第 11 頁（片格、片孔、紅色格號、片格下的季名）。底色用網頁原本的紙色。 */
.spread.shiki{justify-content:center;--red:#b13a2e}
.spread.shiki::before{display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px;font-family:var(--serif);font-size:13px;letter-spacing:.3em;line-height:1.5}
.sheet-head b{font-size:20px;font-weight:500;margin-right:14px}
.fr{min-width:0;container-type:inline-size}
.fr-cap{padding:14px 0 0}
.fr-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fr-name{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:.3em;line-height:1.3;color:var(--red);white-space:nowrap}
.fr-name small{font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.1em;color:var(--muted);margin-left:4px}
.fr-title{font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-lat{font-family:var(--serif);font-size:12px;letter-spacing:.3em;line-height:1.6;text-transform:uppercase;margin-top:2px;white-space:nowrap}
.fr-cap .haiku{writing-mode:horizontal-tb;font-size:14px;letter-spacing:.12em;line-height:1.7;font-weight:400;max-height:none;padding:8px 0 0}
.fr-cap .haiku span{margin:0}
.fr-meta{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.fr-meta a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);border-bottom:0}
@container (max-width:260px){.fr-lat{font-size:11px;letter-spacing:.12em}}
@container (max-width:175px){.fr-lat{letter-spacing:.04em}.fr-name{font-size:20px}}
@container (max-width:155px){.fr-lat{font-size:10px;letter-spacing:.02em}.fr-name{font-size:18px;letter-spacing:.2em}}

.sheet{flex:1;min-width:0;max-width:max(760px,calc((var(--H) - 360px) * 2.667))}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.ph{display:block;line-height:0}
.ph img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;object-position:var(--pos,50% 50%)}
.band{display:flex;height:14px;margin-top:8px}
.band i{flex:1 1 0;min-width:0}

/* 照片與圖說 */
.fig{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:14px;margin:0;--h:calc(var(--H) - 96px)}
.photo{display:block;padding:0;border:0;line-height:0;background:transparent;cursor:pointer;flex:none}
.photo img{display:block;width:min(var(--w),calc(var(--h) * var(--r)));height:auto;max-width:none;object-fit:contain}
.fig.opener-photo{--w:58vw}
.fig.single-photo{--w:min(82vw,calc(94vw - 200px))}
.fig.large{--w:56vw;--h:calc(var(--H) - 150px);align-self:flex-start;margin-top:2vh}
.fig.small{--w:19vw;--h:calc(var(--H) * .4);align-self:flex-end;margin-bottom:2vh}
.cap{writing-mode:vertical-rl;text-orientation:mixed;flex:none;font-size:13px;line-height:1.8;letter-spacing:.06em;color:var(--muted);max-height:min(calc(var(--w) / var(--r)),var(--h))}
.cap .cap-no,.cap .cap-title{display:block;color:var(--ink)}
.cap .cap-title{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
.cap .cap-haiku{display:block;font-family:var(--serif);font-size:15px;letter-spacing:.1em;color:var(--ink)}
.cap .cap-haiku span{display:block}
.cap .cap-prose{display:block}
.cap .ex{margin-inline-end:1.1em;white-space:nowrap}

/* 別卷（新）：跟四季殘響同一套，橫排、照片不裁 */
.spread.bek{justify-content:center;--red:#b13a2e}
.spread.bek::before{display:none}
.lst2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:56px;border-top:1px solid var(--spread-rule)}
.li2{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:26px;align-items:end;padding:24px 0;border-bottom:1px solid var(--spread-rule)}
.li2 .fr-cap{padding:0}
.li2 .fr-lat{white-space:normal}
.li2 .ph{display:block;line-height:0;justify-self:start;max-width:100%}
.li2 .ph img{display:block;width:auto;height:auto;max-width:100%;max-height:clamp(140px,19vh,210px);aspect-ratio:auto;object-fit:fill}
/* 別卷不必擠進第一個畫面，矮螢幕上不用跟著四季縮那麼小；羅馬字字距縮一點，窄欄也排得下一行 */
.spread.bek .sheet{max-width:max(1180px,calc((var(--H) - 360px) * 2.667))}
.li2 .fr-lat{letter-spacing:.16em}
.sheet-head .sheet-h1{margin:0;font:inherit;letter-spacing:inherit}
/* 題名放不下時換到下一行，不截字；攝影誌只有兩本，照片放大 */
.li2 .fr-head{flex-wrap:wrap}
#shi .li2 .ph img{max-height:clamp(180px,42vh,440px)}

/* 攝影誌索引 */
.colophon-grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));direction:rtl;gap:30px 12px;align-content:center}
.yr{direction:ltr;writing-mode:vertical-rl;text-orientation:mixed;height:300px;padding:4px 0;border-right:1px solid var(--ink)}
.yr b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.1em;line-height:1.3;margin:0 10px 0 12px}
.yr>span{display:block;font-size:13px;color:var(--muted);letter-spacing:.1em;line-height:1.75;white-space:nowrap}
.card{direction:ltr;height:300px;min-width:0;display:flex;flex-direction:column;gap:10px;padding:4px 10px 4px 0;border-right:1px solid var(--card-rule)}
.card .photo{height:72px;display:flex;align-items:center;justify-content:center}
.card .photo img{width:auto;height:auto;max-width:100%;max-height:100%}
.card a{flex:1;min-height:0;writing-mode:vertical-rl;text-orientation:mixed;font-size:13px;line-height:1.75;letter-spacing:.05em;color:var(--muted)}
.card a>span{display:block}
.card a b{display:block;font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.1em;color:var(--ink)}
.card a:hover{opacity:1;color:var(--ink)}

/* 卷末：前後卷 */
.endnav{writing-mode:vertical-rl;text-orientation:mixed;display:block;align-self:center}
.endnav a{display:block;margin-left:44px;padding:4px 0}
.endnav small{display:block;font-size:13px;letter-spacing:.1em;color:var(--muted);margin-left:12px}
.endnav b{font-family:var(--serif);font-size:40px;font-weight:500;letter-spacing:.3em;line-height:1.3}

/* ≤1100px：改回橫排；季語名、短句保留直排當裝飾 */
@media (max-width:1100px){
  .spread{display:block;min-height:0;padding:30px 0 34px}
  .spread::before{display:none}
  .head{writing-mode:horizontal-tb;padding:0 18px 22px}
  .head>*{margin:0 0 6px}
  .masthead h1{font-size:30px;letter-spacing:.12em}
  .chapter-no,.chapter-head .chapter-no{font-size:24px;letter-spacing:.2em}
  .head .btn,.v .btn{padding:8px 15px;min-height:44px;margin-top:6px}
  /* 刊頭與卷首：右邊直排名稱，左邊橫排資料 */
  .vhead{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:16px;padding:0 18px 22px}
  .vhead .vname,.vhead h1.vt{writing-mode:vertical-rl;text-orientation:mixed;flex:none}
  .vhead h1.vt{font-family:var(--serif);font-size:40px;font-weight:500;letter-spacing:.22em;line-height:1.25;margin:0}
  .kan{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:16px;padding:0 18px 22px}
  .kan .chapter-no{font-size:40px}
  .kan .info,.vhead .info{writing-mode:horizontal-tb;flex:1;min-width:0;align-self:flex-end;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0}
  .kan .info>*,.vhead .info>*{margin:0}
  .haiku{font-size:15px;letter-spacing:.12em;line-height:1.8;font-weight:400;max-height:none;padding:6px 0 0}
  .haiku span{margin-left:6px}
  .haiku.prose{display:none}
  .fig{display:block;margin:0 0 28px}
  .fig .photo{width:100%}
  .photo img,.fig .photo img{width:100%;max-width:100%;height:auto}
  .cap{writing-mode:horizontal-tb;max-height:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 18px 0}
  .cap .cap-haiku,.cap .cap-prose{flex-basis:100%}
  .cap .ex{margin:0}
  .toc{writing-mode:horizontal-tb;display:block;padding:0 18px}
  .toc h2{margin:22px 0 6px;padding:0 0 6px;border-bottom:1px solid var(--card-rule)}
  .toc h2:not(:first-child){margin-right:0}
  .toc a{display:flex;align-items:baseline;gap:12px;min-height:44px;margin:0;padding:6px 0;border-bottom:1px solid var(--spread-rule)}
  .toc a b{font-size:20px;letter-spacing:.2em}
  .colophon-grid{display:block;padding:0 18px}
  .yr{writing-mode:horizontal-tb;height:auto;border:0;border-bottom:1px solid var(--ink);padding:20px 0 6px;display:flex;align-items:baseline;justify-content:space-between}
  .yr b{margin:0;font-size:24px}
  .yr>span{margin:0}
  .card{writing-mode:horizontal-tb;height:auto;flex-direction:row;align-items:center;gap:14px;padding:12px 0;border:0;border-bottom:1px solid var(--card-rule)}
  .card .photo{width:104px;height:72px;flex:none}
  .card a{writing-mode:horizontal-tb;flex:1;min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .card a b{font-size:16px}
  .endnav{writing-mode:horizontal-tb;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;direction:rtl}
  .endnav a{direction:ltr;margin:0;padding:12px 0;border-top:1px solid var(--card-rule);min-height:44px}
  .endnav small{margin:0 0 4px}
  .endnav b{font-size:20px;letter-spacing:.12em}
  .sheet{max-width:none;padding:0 18px}
  .fr-cap .haiku{display:block;font-size:13px}
  .fr-cap .haiku.prose{display:none}
  .lst2{grid-template-columns:minmax(0,1fr)}   /* 別卷：平板改一欄，照片才不會太小 */
}
@media (max-width:700px){
  /* 別卷：手機一欄，照片在上、字在下 */
  .lst2{grid-template-columns:minmax(0,1fr)}
  .li2{grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
  .li2 .ph{order:-1;justify-self:stretch}
  .li2 .ph img{width:100%;max-height:none}
  #shi .li2 .ph img{max-height:none}
  /* 手機：四格排不下，改成可以左右滑 */
  .strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px;scroll-padding-inline:18px;scrollbar-width:none;overscroll-behavior-x:contain}
  .strip::-webkit-scrollbar{display:none}
  .fr{flex:0 0 41vw;scroll-snap-align:start}
  .band{height:10px;margin-top:6px}
  .sheet-head{font-size:12px;letter-spacing:.2em}
  .topbar{padding:0 14px;font-size:12px;gap:12px}
  .topbar nav{gap:16px}
  .topbar .ctx{display:none}
  .masthead h1,.vhead h1.vt{font-size:40px}
  .vhead.long{display:block}
  .vhead.long h1.vt{writing-mode:horizontal-tb;font-size:30px;letter-spacing:.12em;margin:0 0 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
<style>
/* ════ 色譜相簿頁：從 palette/index.html 搬來，數值照抄。
   只在相簿頁（html.pm）生效；類別、變數、id 一律加 p- 前綴，跟歲時記的規則互不干擾。 ════ */
@property --p-bg { syntax: '<color>'; inherits: true; initial-value: #EEE9DF; }
@property --p-ink { syntax: '<color>'; inherits: true; initial-value: #1B1714; }
@property --p-ink2 { syntax: '<color>'; inherits: true; initial-value: #5B5249; }
@property --p-line { syntax: '<color>'; inherits: true; initial-value: #C9C0B3; }
:root {
  --p-card: #FBFAF6;
  --p-card-line: #E4DED3;
  --p-ink-d: #1B1714;
  --p-ink-d2: #675D54;
  --p-serif: "Noto Serif TC", serif;
  --p-sans: "Noto Sans TC", sans-serif;
  --p-latin: "Instrument Serif", "Noto Serif TC", serif;
  --p-mono: "IBM Plex Mono", "Noto Sans TC", monospace;
  --p-gut: clamp(16px, 4vw, 60px);
  --p-bar: 58px; /* 頂列沿用歲時記的 58px，手機也是 */
  --p-ease: cubic-bezier(.2, .75, .2, 1);
}
html.pm {
  --pv-bg: #0D0B0A; --pv-ink: #EFE9E0; --pv-muted: #B9AFA3; --pv-line: rgba(239, 233, 224, .35);
  --pv-font: "Noto Sans TC", sans-serif;
  background: var(--p-bg); -webkit-text-size-adjust: 100%;
  transition: --p-bg .9s ease, --p-ink .9s ease, --p-ink2 .9s ease, --p-line .9s ease;
}
html.pm body { background: var(--p-bg); color: var(--p-ink); font-family: var(--p-sans); font-size: 15px; line-height: 1.6; overflow-x: clip; overflow-anchor: none; -webkit-font-smoothing: antialiased; }
html.pm main img { display: block; }
html.pm :focus-visible { outline: 2px solid var(--p-ink); outline-offset: 3px; }
html.pm main a:hover { opacity: 1; }
.p-sr { position: fixed !important; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 頂列：連結、位置、字級照歲時記；底色、字色、字族換成色譜的 ── */
html.pm .topbar { background: var(--p-bg); color: var(--p-ink); border-bottom-color: var(--p-line); font-family: var(--p-sans); font-weight: 500; }
html.pm .topbar .home { font-family: var(--p-serif); font-weight: 700; }
html.pm .topbar nav a, html.pm .topbar .ctx { color: var(--p-ink2); }
html.pm .topbar nav a[aria-current="true"] { color: var(--p-ink); }

/* ── 排序膠囊 ── */
.p-pills { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--p-line); border-radius: 999px; }
.p-pills button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 44px; padding: 5px 13px; border: 0; border-radius: 999px; background: transparent; color: var(--p-ink); font: 500 13px/1.3 var(--p-sans); letter-spacing: .04em; white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color .25s, color .25s; }
.p-pills button:hover { background: color-mix(in srgb, var(--p-ink) 10%, transparent); }
.p-pills [aria-checked="true"] { background: var(--p-ink); color: var(--p-bg); }

/* ── 刊頭 ── */
.p-cover { display: flex; flex-direction: column; padding: clamp(16px, 4.2vh, 46px) var(--p-gut) clamp(14px, 3.2vh, 34px); gap: clamp(10px, 2.2vh, 24px); }
.p-cover.fill { min-height: calc(100svh - var(--p-bar)); }
.p-c-mast { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px 32px; flex-wrap: wrap; padding-bottom: clamp(8px, 1.5vh, 16px); border-bottom: 1.5px solid var(--p-ink); }
.p-c-title { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 .32em; font: 700 clamp(46px, 7.4vw, 116px)/.95 var(--p-serif); letter-spacing: .03em; }
.p-c-title em { font: italic 400 clamp(22px, 2.7vw, 42px)/1 var(--p-latin); letter-spacing: .01em; }
.p-c-issue { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
.p-c-issue b { font: 400 clamp(34px, 4.4vw, 68px)/.9 var(--p-latin); font-variant-numeric: lining-nums; }
.p-c-issue span { font-size: 14px; letter-spacing: .14em; }
.p-c-feature { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 24px; flex-wrap: wrap; }
.p-c-feature h2 { margin: 0; font: 600 clamp(19px, 1.9vw, 27px)/1.3 var(--p-serif); letter-spacing: .06em; }
.p-c-feature h2 .lat { font: italic 400 clamp(21px, 2.1vw, 30px)/1.2 var(--p-latin); letter-spacing: .01em; }
.p-tag { display: inline-block; margin-right: 14px; padding: 2px 8px; border: 1px solid currentColor; font: 500 12px/1.5 var(--p-sans); letter-spacing: .24em; vertical-align: .25em; }
.p-c-feature p { margin: 0; font: 500 12px/1.5 var(--p-mono); letter-spacing: .06em; color: var(--p-ink2); }

/* ── 刊頭下方的色帶 ── */
.p-stripe { flex: 1 1 0; min-width: 0; background: var(--c); box-shadow: inset -2px 0 0 var(--p-bg); transform-origin: 50% 100%; transition: transform .3s var(--p-ease); }
.p-stripe:hover { transform: scaleY(1.07); }
.p-band-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 150px; }
.p-band { flex: 1 1 auto; display: flex; min-height: 110px; cursor: pointer; }
.p-band .p-stripe { box-shadow: inset -2px 0 0 var(--p-bg); }
.p-band-cap { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font: 500 11px/1 var(--p-sans); letter-spacing: .14em; color: var(--p-ink2); }

/* 浮動預覽：只對滑鼠指標 */
.p-tip { position: fixed; z-index: 60; width: 214px; padding: 8px 8px 10px; background: var(--p-card); color: var(--p-ink-d); font: 500 10.5px/1.1 var(--p-mono); box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .6); pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
.p-tip.on { opacity: 1; transform: none; }
.p-tip img { display: block; }
.p-tip-face { display: grid; place-items: center; aspect-ratio: 4 / 3; background: var(--c); }
.p-tip-face img { max-width: 86%; max-height: 86%; width: auto; height: auto; }
.p-tip-cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
.p-tip-t { display: block; margin-top: 6px; font: 600 14px/1.3 var(--p-serif); letter-spacing: .06em; }

/* ── 作品色卡 ── */
.p-plate { position: relative; display: flex; align-items: center; justify-content: center; min-height: calc(100svh - var(--p-bar)); padding: var(--pad) var(--p-gut); scroll-margin-top: var(--p-bar); --pad: clamp(18px, 4vh, 40px); }
.p-plate-in { --side: clamp(232px, 18.6vw, 276px); --gap: clamp(22px, 3.1vw, 50px); --rankw: clamp(60px, 6.6vw, 100px); display: grid; grid-template-columns: var(--rankw) auto var(--side); column-gap: var(--gap); align-items: center; }
.p-rank { align-self: start; display: grid; justify-items: end; color: var(--p-ink); }
.p-rank b { font: 400 clamp(54px, 6.4vw, 100px)/.8 var(--p-latin); letter-spacing: -.01em; font-variant-numeric: lining-nums; }
.p-rank span { margin-top: 8px; font: 400 18px/1 var(--p-latin); color: var(--p-ink2); }
.p-rank em { margin-top: 16px; font: normal 500 12px/1 var(--p-sans); letter-spacing: .3em; color: var(--p-ink2); writing-mode: vertical-rl; }
.p-card { --label: 118px; width: min(calc(100vw - 2 * var(--p-gut) - var(--rankw) - var(--side) - 2 * var(--gap) - 18px), calc((100svh - var(--p-bar) - 2 * var(--pad) - var(--label)) * var(--ar))); margin: 0; background: var(--p-card); color: var(--p-ink-d); box-shadow: 0 1px 2px rgba(0, 0, 0, .1), 0 28px 56px -26px rgba(0, 0, 0, .55); }
.p-card-photo { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: #DCD6CC; cursor: zoom-in; }
.p-card-photo img { width: 100%; height: auto; aspect-ratio: var(--ar); }
html.pm .p-card-photo:focus-visible { outline: 3px solid var(--p-ink); outline-offset: 4px; }
.p-card-label { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 3px 18px; padding: 13px 18px 15px; }
.p-cl-no { font: 500 12px/1 var(--p-mono); letter-spacing: .1em; }
.p-cl-main { display: flex; align-items: center; gap: 7px; justify-self: end; font: 500 12px/1 var(--p-mono); letter-spacing: .04em; }
.p-cl-main i { width: 11px; height: 11px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.p-cl-main small { font: 400 11px var(--p-sans); color: var(--p-ink-d2); letter-spacing: .1em; }
.p-cl-title { grid-column: 1 / -1; margin: 4px 0 0; font: 700 clamp(21px, 2.1vw, 30px)/1.25 var(--p-serif); letter-spacing: .06em; }
.p-cl-title.is-date { font: 500 clamp(18px, 1.7vw, 24px)/1.25 var(--p-mono); letter-spacing: .04em; }
/* 色譜原稿的 <p class="cl-meta"> 帶著瀏覽器預設的段落邊距；歲時記把 p 歸零了，這裡補回來 */
.p-cl-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 14px; margin: 1em 0; font-size: 12.5px; color: var(--p-ink-d2); }
.p-cl-meta span:first-child { color: var(--p-ink-d); }
.p-strip { align-self: center; background: var(--p-card); color: var(--p-ink-d); font-size: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .1), 0 22px 44px -26px rgba(0, 0, 0, .5); }
.p-strip-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px 8px; border-bottom: 1px solid var(--p-card-line); font: 500 10.5px/1.2 var(--p-mono); letter-spacing: .16em; }
.p-strip-head::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .45), 0 0 0 1px rgba(0, 0, 0, .06); }
.p-strip-head span:last-child { margin-left: auto; }
.p-sws { list-style: none; margin: 0; padding: 0; }
.p-sw { display: grid; grid-template-columns: 42% minmax(0, 1fr) auto; align-items: center; height: clamp(30px, 5.3svh, 50px); border-bottom: 1px solid var(--p-card-line); }
.p-sw-chip { position: relative; height: 100%; background: var(--c); }
.p-sw-chip small { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); padding: 3px 5px 2px; background: var(--p-ink-d); color: var(--p-card); font: 500 10px/1 var(--p-sans); letter-spacing: .12em; }
.p-sw-chip.is-dark small { background: var(--p-card); color: var(--p-ink-d); }
.p-sw-hex { padding-left: 12px; font: 500 12.5px/1 var(--p-mono); letter-spacing: .02em; white-space: nowrap; }
.p-sw-pct { padding-right: 14px; font: 400 11px/1 var(--p-mono); color: var(--p-ink-d2); }
.p-exif { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; margin: 0; padding: 11px 14px 13px; }
.p-exif div { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 0 10px; align-items: baseline; }
.p-exif dt { font-size: 11.5px; color: var(--p-ink-d2); white-space: nowrap; }
.p-exif dd { margin: 0; font: 400 11.5px/1.5 var(--p-mono); overflow-wrap: anywhere; text-wrap: balance; }

/* ── 相簿結尾：深色版權頁兼導覽（前後、回目次、同類清單） ── */
.p-colophon { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: clamp(28px, 4vw, 64px); padding: clamp(48px, 9vh, 96px) var(--p-gut) clamp(40px, 7vh, 72px); background: var(--p-bg); color: var(--p-ink); font-size: 12.5px; line-height: 1.6; }
.p-co-mast b { display: block; font: 700 clamp(26px, 3vw, 42px)/1.15 var(--p-serif); letter-spacing: .06em; }
.p-co-mast span { display: block; margin-top: 8px; font: italic 400 18px/1 var(--p-latin); color: var(--p-ink2); }
.p-co-nav { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.p-co-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--p-line); border-radius: 999px; text-decoration: none; font: 500 13px/1.3 var(--p-sans); letter-spacing: .04em; }
.p-co-nav a:hover { background: color-mix(in srgb, var(--p-ink) 10%, transparent); }
.p-co-col h3 { margin: 0 0 10px; padding-top: 12px; border-top: 1.5px solid var(--p-ink); font: 600 17px/1.3 var(--p-serif); letter-spacing: .12em; }
.p-co-col ul { list-style: none; margin: 0; padding: 0; }
.p-co-col a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--p-line); text-decoration: none; }
.p-co-col a i { display: flex; height: 10px; }
.p-co-col a i s { flex: 1; background: var(--c); }
.p-co-col a b { font: 600 14px/1.3 var(--p-serif); letter-spacing: .06em; }
.p-co-col a span { font: 400 11.5px/1 var(--p-mono); color: var(--p-ink2); }
.p-co-col a[aria-current="page"] b { text-decoration: underline; text-underline-offset: 4px; }

/* ── 中寬：作品頁改單欄，色票條改橫排 ── */
@media (max-width: 1080px) {
  .p-plate-in { grid-template-columns: minmax(0, 1fr); row-gap: 16px; width: min(100%, 760px); }
  .p-rank { justify-items: start; grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 10px; }
  .p-rank b { font-size: 46px; }
  .p-rank span { margin: 0; }
  .p-rank em { writing-mode: horizontal-tb; margin: 0 0 0 6px; letter-spacing: .2em; }
  .p-card { width: 100%; }
  .p-strip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .p-strip-head { grid-column: 1 / -1; }
  .p-sws { grid-row: span 2; display: grid; grid-template-columns: repeat(5, 1fr); border-right: 1px solid var(--p-card-line); align-self: start; }
  .p-sw { grid-template-columns: 1fr; grid-template-rows: 64px auto auto; height: auto; border-bottom: 0; }
  .p-sw + .p-sw { border-left: 1px solid var(--p-card-line); }
  .p-sw-hex { padding: 8px 0 0 8px; font-size: 11.5px; }
  .p-sw-chip small { left: 6px; top: auto; bottom: 6px; transform: none; }
  .p-sw-pct { padding: 3px 0 9px 8px; }
  .p-colophon { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .p-co-mast { grid-column: 1 / -1; }
}

/* ── 手機 ── */
@media (max-width: 720px) {
  .p-pills button { padding: 5px 12px; font-size: 12.5px; letter-spacing: .02em; }
  .p-c-mast { flex-direction: column; align-items: flex-start; gap: 10px; }
  .p-c-feature { flex-direction: column; gap: 4px; }
  .p-band-wrap { min-height: 240px; }
  .p-cover.fill { min-height: 0; }
  .p-band { min-height: 240px; }
  .p-band .p-stripe { box-shadow: inset -1px 0 0 var(--p-bg); }
  .p-plate { --pad: 30px; min-height: 0; padding-top: 34px; padding-bottom: 34px; }
  .p-strip { grid-template-columns: minmax(0, 1fr); }
  .p-sws { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--p-card-line); }
  .p-sw { grid-template-rows: 46px auto auto; }
  .p-sw-hex { padding: 7px 0 0 6px; font-size: 10.5px; letter-spacing: 0; }
  .p-sw-pct { padding: 3px 0 8px 6px; font-size: 10px; }
  .p-exif { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-flow: row dense; gap: 6px 14px; }
  .p-exif div { grid-template-columns: 4.4em minmax(0, 1fr); }
  .p-exif div.wide { grid-column: 1 / -1; }
  .p-card-label { padding: 12px 14px 13px; }
  .p-cl-meta { gap: 0 10px; font-size: 12px; }
  .p-colophon { grid-template-columns: minmax(0, 1fr); }
}

/* ── 矮視窗（桌機寬、高度不足）：縮短色卡標籤 ── */
@media (min-width: 1081px) and (max-height: 760px) {
  .p-card { --label: 92px; }
  .p-card-label { padding: 10px 16px 11px; }
  .p-cl-title { margin-top: 2px; font-size: 21px; }
  .p-cl-meta { font-size: 12px; }
  .p-plate { --pad: 18px; }
  .p-strip-head { padding: 7px 12px 6px; }
  .p-exif { gap: 3px; padding: 8px 12px 10px; }
  .p-exif dd { line-height: 1.4; }
}

@media (prefers-reduced-motion: reduce) {
  html.pm { transition: none; }
}

/* ══════════════════════════════════════════════════════════════════
   相簿頁：高級雜誌・何布版（magazine-hobu-edition）
   只在 html.album 底下生效，類別一律 m- 開頭，不碰首頁的歲時記樣式。
   色碼、字級、間距照風格本與何布那本 2024 年 10 月月誌。
   ══════════════════════════════════════════════════════════════════ */
html.album{background:#eee9df;--pv-bg:#11110f;--pv-ink:#f3efe6;--pv-muted:#bdb8ae;--pv-line:#3b3a37;--pv-font:"Noto Sans TC","PingFang TC",sans-serif}
html.album body{background:#eee9df;color:#1b1a17;-webkit-font-smoothing:antialiased;overflow-x:clip;
  --m-serif:"Noto Serif TC","Songti TC",serif;--m-sans:"Noto Sans TC","PingFang TC",sans-serif;--m-latin:"Cormorant Garamond","Noto Serif TC","Songti TC",serif;
  --g:clamp(20px,4vw,72px);--cap:44px;--mh:64px;font-family:var(--m-serif)}
html.album a:hover{opacity:1}
html.album :focus-visible{outline:2px solid currentColor;outline-offset:4px}
/* 頂列換成刊頭的樣子，連結不變 */
html.album .topbar{height:var(--mh);padding:0 var(--g);background:#eee9df;color:#1b1a17;border-bottom:1px solid #1b1a17;font:400 13px/1.4 var(--m-sans);letter-spacing:.12em}
html.album .topbar .home{font:500 19px/1 var(--m-serif);letter-spacing:.32em}
html.album .topbar nav a{color:#625d54}
html.album .topbar nav a[aria-current="true"],html.album .topbar .ctx{color:#1b1a17}
html.album .topbar .ctx{font-variant-numeric:tabular-nums}

.m-sec{position:relative;background:var(--bg);color:var(--fg);scroll-margin-top:var(--mh)}
.mt-paper{--bg:#eee9df;--fg:#1b1a17;--fg2:#625d54;--rule:#d3ccbf}
.mt-char{--bg:#1d1d1c;--fg:#ece7dd;--fg2:#a8a399;--rule:#3b3a37}
.mt-warm{--bg:#ece4d6;--fg:#201b15;--fg2:#665c4f;--rule:#cfc2ad}
.mt-mist{--bg:#e6e9e5;--fg:#1a1e1f;--fg2:#5a6163;--rule:#c5cbc6}
.m-album.series{--cap:66px}

/* 照片與圖說 */
.m-ph{min-width:0;margin:0}
.m-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.m-ph img{display:block;width:100%;height:auto;background:rgba(127,127,127,.12)}
.m-btn:hover img{opacity:.94}
.m-cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:12px;font:400 13px/1.5 var(--m-sans);letter-spacing:.05em;color:var(--fg2);font-variant-numeric:tabular-nums}
.m-cap .l{min-width:0}
.m-cap b{font-weight:500;color:var(--fg);margin-right:1em}
.m-cap time,.m-cap .yy{white-space:nowrap}
.m-cap .hk{display:block;margin-top:2px;font-family:var(--m-serif);letter-spacing:.1em}
.m-js .m-rv{transition:opacity 1.1s cubic-bezier(.2,.65,.2,1),transform 1.1s cubic-bezier(.2,.65,.2,1)}
.m-js .m-rv:not(.in){opacity:0;transform:translateY(18px)}
@media (prefers-reduced-motion:reduce){.m-js .m-rv{transition:none}.m-js .m-rv:not(.in){opacity:1;transform:none}}

/* 頁碼 */
.m-folio{position:absolute;left:var(--g);right:var(--g);bottom:clamp(14px,2.6svh,28px);display:flex;justify-content:space-between;gap:16px;font:400 12px/1 var(--m-sans);letter-spacing:.1em;color:var(--fg2);pointer-events:none}
.m-pg{font:500 15px/1 var(--m-latin);letter-spacing:.04em;margin-left:1.1em;color:var(--fg)}

/* 封面（攝影誌）：超大細字標題加目錄。橫幅照片滿版在上；一般比例的照片不裁切，放左邊 */
.m-cover{--pt:clamp(20px,3.4svh,44px);--type:clamp(200px,32svh,330px);min-height:calc(100svh - var(--mh))}
.m-cover.wide{display:flex;flex-direction:column}
.m-cover.wide .m-ph{width:100%}
.m-cover.wide .m-cap{padding-inline:var(--g)}
.m-cover.wide .m-cover-type{flex:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--g);align-items:end;padding:4px var(--g) clamp(20px,3.4svh,44px)}
.m-cover.wide .m-month{--mfs:clamp(56px,min(calc(var(--type) * .62),calc(46vw / var(--n))),300px)}
.m-cover.side{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--g);padding:var(--pt) var(--g) clamp(20px,3.4svh,44px)}
.m-cover.side .m-ph{align-self:center;width:min(100%,calc((100svh - var(--mh) - 2 * var(--pt) - var(--cap)) * var(--r)))}
.m-cover.side .m-cover-type{display:flex;flex-direction:column;justify-content:space-between;gap:var(--g);min-width:0}
.m-cover.side .m-month{--mfs:clamp(48px,calc(35vw / var(--n)),300px)}
.m-month{font:300 var(--mfs)/.9 var(--m-serif);letter-spacing:.01em;margin-left:-.04em;white-space:nowrap}
.m-month-y{display:block;font:400 clamp(20px,1.9vw,30px)/1 var(--m-latin);letter-spacing:.12em;margin:0 0 .5em .1em}
.m-contents{font:400 13px/1.5 var(--m-sans);letter-spacing:.06em}
.m-contents-h{display:flex;justify-content:space-between;gap:16px;padding-bottom:9px;border-bottom:1px solid #1b1a17;color:#625d54}
.m-contents ol{margin:0;padding:0;list-style:none}
.m-contents button{display:grid;width:100%;grid-template-columns:2.4em minmax(0,1fr) auto 4.6em;gap:12px;align-items:baseline;min-height:44px;padding:11px 0 9px;border:0;border-bottom:1px solid #d3ccbf;background:none;text-align:left;cursor:pointer;font:inherit;letter-spacing:inherit;color:inherit}
.m-contents button:hover .t{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.m-contents .r{font:500 17px/1 var(--m-latin)}
.m-contents .t{font:500 16px/1.3 var(--m-serif);letter-spacing:.14em}
.m-contents .d,.m-contents .n{color:#625d54;font-variant-numeric:tabular-nums;text-align:right}

/* 開章跨頁：色塊加照片 */

// 教授 2026-11-11：攝影誌那邊只放 Lisbon 和 Singapore（從別卷移過來）。何布做過的那些攝影誌不放。
const JOURNAL_IDS = ['lisbon', 'singapore'];
const JOURNALS = PS.series.filter(s => JOURNAL_IDS.includes(s.id));
const SERIES = PS.series.filter(s => !JOURNAL_IDS.includes(s.id));      // 四季加別卷
const THEMES = PS.themes.filter(s => !JOURNAL_IDS.includes(s.id));      // 別卷

// 教授 2026-11-11 20:17、20:27：原來的 Lisbon 相簿拿掉，改成「里斯本攝影集」（主站另一頁）。攝影集排在攝影誌這一區，點了開那一頁。
const BOOKS = PS.data.books || [];
const NJ = JOURNALS.length + BOOKS.length;          // 攝影誌這一區一共幾冊
// 教授 2026-11-11：四季的相簿用色譜，其餘（別卷、攝影誌）用高級雜誌。要對調就改這一行。
const usePalette = g => g.kind === 'season';
(function(){
'use strict';
const app = document.getElementById('app'), ctx = document.getElementById('ctx');
const E = PS.esc;
let cur = [];                       // 目前這頁可放大的照片
PS.bind(app, () => cur);

// ── 文字格式 ──
// 一到兩位數字組成直立字格；四位數年份與相機資訊維持橫躺
const tcy = s => E(s).replace(/\d+/g, d => d.length <= 2 ? `<span class="tcy">${d}</span>` : d);
const pad = n => String(n).padStart(2, '0');
const no = i => `張號 ${tcy(pad(i + 1))}`;
const when = w => { const m = String(w).match(/^(\d{4})\.(.*)$/); if (!m) return tcy(w); return `${m[1]}　${tcy(m[2].replace(/\./g, '・').replace(/[–-]/g, '〜'))}`; };
const md = d => { const [, m, dd] = d.split('-'); return `${tcy(m)}・${tcy(dd)}`; };
const KIND = { place: '旅行', monthly: '月誌', book: '攝影集' };
const NUMS = '一二三四五六七八九十';
const lines = h => String(h || '').split('／').filter(Boolean);
const isVerse = h => String(h || '').includes('／');
const exif = m => String(m || '').split(' · ').filter(Boolean).map(x => `<span class="ex">${E(x)}</span>`).join('<wbr>');
const ratio = p => (p.w / p.h).toFixed(4);
const wide = p => p.w / p.h >= 2;

function haikuBlock(h, cls = '') {
  if (!h) return '';
  if (isVerse(h)) return `<div class="haiku ${cls}">${lines(h).map(l => `<span>${E(l)}</span>`).join('')}</div>`;
  return `<div class="haiku prose ${cls}"><span>${E(h)}</span></div>`;
}

// ── 照片 ──
// 首頁的封面照片點了是進那一本（系列或攝影誌），不是放大。放大只在相簿頁裡。

}

// 攝影誌：跟別卷同一套目錄式兩欄（教授 2026-11-12 00:29「改」）。每本字在左、封面在右，不裁切。
function journalIndex(base) {
  return BOOKS.map(b => ({ href: b.href, name: b.name, short: b.short, count: b.count, cover: b.cover }))
    .concat(JOURNALS.map(s => ({ href: `#/journal/${s.id}`, name: s.name, short: s.short, count: s.count, cover: PS.cover(s) })))

        <p class="fr-meta"><span>${E(b.short)}　${b.count} 張</span><a href="${E(b.href)}">翻開</a></p>
      </div>

}
function journalSpread(base, isPage) {

  return `<section class="spread bek" id="shi" aria-label="攝影誌"><div class="sheet"><header class="sheet-head">${t}</header>
    <div class="lst2">${journalIndex(base)}</div></div></section>`;
}

// 教授 2026-11-11 23:42 在三種樣本裡選 B（色帶）。
// 每張照片的主色：五色裡彩度最高的一色（太暗或太亮的打折）；五色都近灰時取中間那一色。和色譜相簿同一個算法。
function mainColor(p) {
  const lin = c => { c /= 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
  const ok = h => { const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(h.slice(i, i + 2), 16)));
    const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
    const L = .2104542553 * l + .793617785 * m - .0040720468 * s, A = 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, B = .0259040371 * l + .7827717662 * m - .808675766 * s;
    return { L, C: Math.hypot(A, B) }; };
  const o = p.pal.map(ok); let best = -1, bi = 2;
  o.forEach((c, i) => { const v = c.C * (c.L < .2 || c.L > .95 ? .35 : 1); if (v > best) { best = v; bi = i; } });
  if (o[bi].C < .03) bi = 2;
  return p.pal[bi];
}
const COVER_POS = {};
function renderHome() {

  const cap = (s, i, c) => `<div class="fr-cap">
        <div class="fr-head"><h2 class="fr-name"><a href="#/series/${s.id}">${E(s.name)}</a><small>卷${NUMS[i]}</small></h2>${c.title ? `<p class="fr-title">${E(c.title)}</p>` : ''}</div>
        <p class="fr-lat">${E(s.latin)}</p>
        ${haikuBlock(c.haiku)}
        <p class="fr-meta"><span>${E(s.short)}　${s.count} 張</span><a href="#/series/${s.id}">翻開</a></p>
      </div>`;
  const seasons = `<section class="spread shiki" id="shiki" aria-label="四季"><div class="sheet">${head}

      <div class="band" aria-hidden="true">${s.photos.map(p => `<i style="background:${mainColor(p)}"></i>`).join('')}</div>

  // 教授 2026-11-12 00:22 在別卷的兩種左右並列裡選目錄式兩欄。
  const bekHead = `<header class="sheet-head"><p><b>別卷</b></p></header>`;
  const bekCap = (s, i, c) => `<div class="fr-cap">
        <div class="fr-head"><h2 class="fr-name"><a href="#/series/${s.id}">${E(s.name)}</a><small>${ROMAN(i + 1)}</small></h2>${c.title ? `<p class="fr-title">${E(c.title)}</p>` : ''}</div>
        <p class="fr-lat">${E(s.latin)}</p>
        ${haikuBlock(c.haiku)}
        <p class="fr-meta"><span>${E(s.short)}　${s.count} 張</span><a href="#/series/${s.id}">翻開</a></p>
      </div>`;
  // 別卷：目錄式，左右兩欄並排；每卷左邊是卷名與俳句，右邊是封面（不裁切）。
  const bekkan = `<section class="spread bek" id="bekkan" aria-label="別卷"><div class="sheet">${bekHead}
    <div class="lst2">${T.map((s, i) => { const c = PS.cover(s);
      return `<article class="li2" aria-label="${E(s.name)}">
      ${bekCap(s, i, c)}
      <a class="ph" href="#/series/${s.id}" aria-label="翻開 ${E(s.name)}">${PS.img(c, { size: 's' })}</a>
    </article>`; }).join('')}</div></div></section>`;
  app.innerHTML = seasons + bekkan + journalSpread(S.length + T.length, false);
  ctx.textContent = PS.site.latin;
}

function renderJournals() {
  cur = [];
  app.innerHTML = journalSpread(0, true);
  ctx.textContent = NJ ? `攝影誌　${NJ} 冊` : '攝影誌';
}

// ════ 色譜相簿頁：從 palette/index.html 搬來，計算方式與數值照抄 ════
const P = (function () {
  const $ = s => document.querySelector(s);
  const esc = PS.esc;
  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PAPER = { bg: '#EEE9DF', ink: '#1B1714', ink2: '#5B5249', line: '#C9C0B3' };
  const DARK = { bg: '#15120F', ink: '#F3EEE6', ink2: '#ADA294', line: '#3B342E' };
  const PKIND = { place: '旅行誌', monthly: '月誌', book: '攝影集' };
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const dot = d => d ? d.replace(/-/g, '.') : '';
  const root = document.documentElement;
  // 色譜的 Google Fonts 只在相簿頁生效。歲時記的字族清單裡也有 Noto Serif TC、Noto Sans TC，
  // 這組字型一直開著的話，系統字缺的字（例如「・」）會改用它，首頁就跟歲時記不一樣了。
  const fonts = document.getElementById('p-fonts');

  // ── 色彩計算 ──
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lin = c => { c /= 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
  const lum = h => { const [r, g, b] = rgb(h).map(lin); return .2126 * r + .7152 * g + .0722 * b; };
  const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t).toString(16).padStart(2, '0')).join(''); };
  function oklab(h) {
    const [r, g, b] = rgb(h).map(lin);
    const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b);
    const m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b);
    const s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
    const L = .2104542553 * l + .793617785 * m - .0040720468 * s;
    const A = 1.9779984951 * l - 2.428592205 * m + .4505937099 * s;
    const B = .0259040371 * l + .7827717662 * m - .808675766 * s;
    return { L, C: Math.hypot(A, B), h: (Math.atan2(B, A) * 180 / Math.PI + 360) % 360 };
  }
  // 主色：五色裡彩度最高的一色（太暗或太亮的打折）；五色都近灰時取中間那一色
  function mainIdx(p) {
    if (p._mi != null) return p._mi;
    const o = p.pal.map(oklab); let best = -1, bi = 2;
    o.forEach((c, i) => { const s = c.C * (c.L < .2 || c.L > .95 ? .35 : 1); if (s > best) { best = s; bi = i; } });
    if (o[bi].C < .03) bi = 2;
    p._o = o; return (p._mi = bi);
  }
  const mainHex = p => p.pal[mainIdx(p)];
  // 文字色：淺深兩組候選取對比高的一邊，挑第一個 ≥ 4.5 的；ink2 是混合後仍 ≥ 4.5 的最淡版本
  const themeCache = new Map();
  function themeFor(bg) {
    if (themeCache.has(bg)) return themeCache.get(bg);
    const LT = ['#FBF8F2', '#FFFFFF'], DK = ['#1B1714', '#0E0B09', '#000000'];
    const side = Math.max(...LT.map(c => cr(c, bg))) >= Math.max(...DK.map(c => cr(c, bg))) ? LT : DK;
    const ink = side.find(c => cr(c, bg) >= 4.5) || side.reduce((a, c) => cr(c, bg) > cr(a, bg) ? c : a);
    let ink2 = ink;
    for (let k = 34; k >= 5; k--) { const c = mix(ink, bg, k / 100); if (cr(c, bg) >= 4.5) { ink2 = c; break; } }
    const t = { bg, ink, ink2, line: mix(ink, bg, .7) };
    themeCache.set(bg, t); return t;
  }
  // theme-color 只在相簿頁存在；歲時記原本沒有這個 meta，回首頁時整個拿掉
  let curTheme = '', metaTheme = null;
  function setTheme(t) {
    if (t.bg === curTheme) return; curTheme = t.bg;
    const r = root.style;
    r.setProperty('--p-bg', t.bg); r.setProperty('--p-ink', t.ink); r.setProperty('--p-ink2', t.ink2); r.setProperty('--p-line', t.line);
    if (!metaTheme) { metaTheme = document.createElement('meta'); metaTheme.name = 'theme-color'; document.head.appendChild(metaTheme); }
    metaTheme.setAttribute('content', t.bg);
  }

  // ── 排序：色譜（主色色相，起點 180°、每 10° 一組，組內由亮到暗；低彩度排最後）或原序 ──
  let mode = 'color';
  try { mode = localStorage.getItem('saijiki-palette-sort') || 'color'; } catch (e) {}
  function specKey(p) {
    mainIdx(p); const o = p._o[p._mi];
    return o.C >= .045 ? [0, Math.floor(((o.h - 180 + 360) % 360) / 10), -o.L] : [1, 0, -o.L];
  }
  function order(g) {
    const idx = g.photos.map((p, i) => i);
    if (mode !== 'color') return idx;
    const k = g.photos.map(specKey);
    return idx.sort((a, b) => k[a][0] - k[b][0] || k[a][1] - k[b][1] || k[a][2] - k[b][2] || a - b);
  }
  const stripes = g => order(g).map(i => `<i class="p-stripe" data-i="${i}" style="--c:${mainHex(g.photos[i])}"></i>`).join('');
  const sorterHTML = () => `<div class="p-pills" role="radiogroup" aria-label="色帶排序">${[['color', '色譜'], ['time', '原序']].map(([k, l]) => `<button type="button" role="radio" data-sort="${k}" aria-checked="${mode === k}" tabindex="${mode === k ? 0 : -1}">${l}</button>`).join('')}</div>`;

  function resort(next) {
    if (next === mode) return;
    mode = next; try { localStorage.setItem('saijiki-palette-sort', mode); } catch (e) {}
    document.querySelectorAll('[data-sort]').forEach(b => { b.setAttribute('aria-checked', b.dataset.sort === mode); b.tabIndex = b.dataset.sort === mode ? 0 : -1; });
    const bands = [...document.querySelectorAll('[data-band]')];
    const anim = !reduce(), first = new Map();
    if (anim) bands.forEach(b => [...b.children].forEach(s => first.set(s, s.getBoundingClientRect().left)));
    bands.forEach(b => { const g = PS.group(b.dataset.band); order(g).forEach(i => b.appendChild(b.querySelector(`[data-i="${i}"]`))); });
    if (anim) bands.forEach(b => [...b.children].forEach((s, k) => {
      const dx = first.get(s) - s.getBoundingClientRect().left;
      if (Math.abs(dx) > .5) s.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 700, delay: k * 5, easing: 'cubic-bezier(.2,.75,.2,1)', fill: 'backwards' });
    }));
    live.textContent = mode === 'color' ? '色帶依色譜排列' : '色帶依原本順序排列';
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-sort]'); if (b) resort(b.dataset.sort); });
  document.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('[data-sort]'); if (!b) return;
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault(); const all = [...b.parentNode.querySelectorAll('[data-sort]')];
    const n = all[(all.indexOf(b) + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + all.length) % all.length];
    resort(n.dataset.sort); n.focus();
  });

  // ── 作品色卡 ──
  function parseMeta(m) {
    const o = {}; if (!m) return o;
    m.split(' · ').forEach((t, i) => {
      if (/^[\d.]+ mm$/.test(t)) o.焦段 = t;
      else if (/^f\//.test(t)) o.光圈 = t;
      else if (/^ISO/.test(t)) o.ISO = t.replace(/^ISO\s*/, '');
      else if (/ s$/.test(t)) o.快門 = t;
      else if (/^\d{4}:\d\d:\d\d/.test(t)) o.時間 = t.slice(11, 16);
      else if (/mm/i.test(t) || /NIKKOR/.test(t)) o.鏡頭 = t;
      else if (i === 0) o.機身 = t;
    });
    return o;
  }
  function plate(g, p, i) {
    const n = g.photos.length, mi = mainIdx(p), main = p.pal[mi];
    const isS = !g.title;
    const title = p.title ? `<h3 class="p-cl-title">${esc(p.title)}</h3>` : `<h3 class="p-cl-title is-date">${esc(dot(p.date))}</h3>`;
    const meta = isS
      ? (p.haiku ? p.haiku.split('／').map(s => `<span>${esc(s)}</span>`).join('') : '')
      : [p.title && dot(p.date), p.place, p.meta].filter(Boolean).map(s => `<span>${esc(s)}</span>`).join('');
    // 色票條：由亮到暗
    const sw = p.pal.map((c, k) => ({ c, k, L: Math.round(p._o[k].L * 100) })).reverse()
      .map(s => `<li class="p-sw"><span class="p-sw-chip${s.L < 52 ? ' is-dark' : ''}" style="--c:${s.c}">${s.k === mi ? '<small>主色</small>' : ''}</span><span class="p-sw-hex">${s.c.toUpperCase()}</span><span class="p-sw-pct">L ${s.L}</span></li>`).join('');
    const ex = isS
      ? [['編號', p.no], ['年份', p.year], ['系列', g.name]]
      : (() => { const m = parseMeta(p.meta); return [['日期', dot(p.date)], ['時間', m.時間], ['機身', m.機身], ['鏡頭', m.鏡頭, 1], ['焦段', m.焦段], ['光圈', m.光圈], ['快門', m.快門], ['ISO', m.ISO]]; })();
    const exif = ex.filter(e => e[1]).map(e => `<div${e[2] ? ' class="wide"' : ''}><dt>${e[0]}</dt><dd>${esc(e[1])}</dd></div>`).join('');
    const alt = PS.caption(p) || `${g.name || g.title} 第 ${i + 1} 張`;
    return `<section class="p-plate" id="p-plate-${i}" data-i="${i}" aria-label="第 ${i + 1} 張">
      <div class="p-plate-in" style="--ar:${(p.w / p.h).toFixed(4)}">
        <div class="p-rank" aria-hidden="true"><b>${pad(i + 1)}</b><span>/ ${n}</span><em>${esc(g.short && g.short.length <= 3 ? g.name : (g.name || g.title))}</em></div>
        <figure class="p-card">
          <button class="p-card-photo" type="button" data-pv="${i}" aria-label="放大：${esc(alt)}">${PS.img(p, { alt, eager: i < 2 })}</button>
          <figcaption class="p-card-label">
            <span class="p-cl-no">${isS ? `No.${esc(p.no)}` : pad(i + 1)}</span>
            <span class="p-cl-main"><i style="--c:${main}"></i>${main.toUpperCase()}<small>主色</small></span>
            ${title}${meta ? `<p class="p-cl-meta">${meta}</p>` : ''}
          </figcaption>
        </figure>
        <aside class="p-strip" style="--c:${main}" aria-label="色票">
          <div class="p-strip-head"><span>色票</span><span>${pad(i + 1)} / ${n}</span></div>
          <ul class="p-sws">${sw}</ul>
          <dl class="p-exif">${exif}</dl>
        </aside>
      </div>
    </section>`;
  }

  // ── 相簿結尾：前後（系列對系列、攝影誌對攝影誌）、回目次、同類清單 ──
  const href = g => isJournal(g) ? `#/journal/${g.id}` : `#/series/${g.id}`;
  const chips = x => `<i>${x.photos.slice(0, 12).map(p => `<s style="--c:${mainHex(p)}"></s>`).join('')}</i>`;
  function colophon(g) {
    const isJ = isJournal(g), list = isJ ? JOURNALS : SERIES, k = list.indexOf(g);
    const L = isJ ? ['上一冊', '下一冊'] : ['前卷', '次卷'];
    const step = (x, l) => x ? `<li><a href="${href(x)}">${chips(x)}<b>${esc(x.name || x.title)}</b><span>${l}</span></a></li>` : '';
    const li = list.map(x => `<li><a href="${href(x)}"${x === g ? ' aria-current="page"' : ''}>${chips(x)}<b>${esc(x.name || x.title)}</b><span>${x.title ? esc(x.when) : x.count + ' 張'}</span></a></li>`).join('');
    return `<footer class="p-colophon" id="p-colophon">
      <div class="p-co-mast"><b>${esc(PS.site.name)}</b><span>${esc(PS.site.latin)}</span>
        <nav class="p-co-nav" aria-label="返回"><a href="#/">目次</a></nav></div>
      <nav class="p-co-col" aria-label="前後"><h3>前後</h3><ul>${step(list[k - 1], L[0])}${step(list[k + 1], L[1])}</ul></nav>
      <div class="p-co-col"><h3>${isJ ? '攝影誌' : '系列'}</h3><ul>${li}</ul></div>
    </footer>`;
  }
  function renderGroup(g) {
    const isJ = !!g.title;
    const feat = isJ
      ? `<h2><span class="p-tag">${PKIND[g.kind]}</span>${esc(g.when)}</h2><p>攝影誌</p>`
      : `<h2><span class="p-tag">${g.kind === 'season' ? '四季' : isJournal(g) ? '攝影誌' : '別卷'}</span><span class="lat">${esc(g.latin)}</span></h2><p>${isJournal(g) ? '' : '系列'}</p>`;
    return `<header class="p-cover fill" id="p-head">
        <div class="p-c-mast"><h1 class="p-c-title">${esc(isJ ? g.title : g.name)}${!isJ && g.short !== g.name ? `<em>${esc(g.short)}</em>` : ''}</h1><div class="p-c-issue"><b>${g.count}</b><span>張</span></div></div>
        <div class="p-c-feature">${feat}</div>
        <div class="p-band-wrap"><div class="p-band" data-band="${g.id}" id="p-band">${stripes(g)}</div>
          <div class="p-band-cap"><span>${g.photos.length} 色</span>${sorterHTML()}</div></div>
      </header>
      <div class="p-plates">${g.photos.map((p, i) => plate(g, p, i)).join('')}</div>` + colophon(g);
  }

  // ── 色帶點一下跳到那張 ──
  let curGroup = null;
  function goPlate(i) {
    const el = document.getElementById('p-plate-' + i); if (!el) return;
    el.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' });
    const b = el.querySelector('.p-card-photo'); if (b) b.focus({ preventScroll: true });
  }
  document.addEventListener('click', e => { const s = e.target.closest('#p-band [data-i]'); if (s) goPlate(+s.dataset.i); });

  // ── 浮動預覽（只對滑鼠） ──
  const tip = document.createElement('div'); tip.className = 'p-tip'; tip.setAttribute('aria-hidden', 'true'); document.body.appendChild(tip);
  const live = document.createElement('p'); live.className = 'p-sr'; live.setAttribute('aria-live', 'polite'); document.body.appendChild(live);
  let tipKey = '';
  document.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !curGroup) return;
    const s = e.target.closest && e.target.closest('[data-band] [data-i]');
    if (!s) { tip.classList.remove('on'); tipKey = ''; return; }
    const p = curGroup.photos[+s.dataset.i], k = p.id;
    if (k !== tipKey) {
      tipKey = k; const c = mainHex(p);
      tip.innerHTML = `<div class="p-tip-face" style="--c:${c}">${PS.img(p, { alt: '', eager: true })}</div><div class="p-tip-cap"><span>${pad(+s.dataset.i + 1)}</span><span>${c.toUpperCase()}</span></div><b class="p-tip-t">${esc(p.title || dot(p.date))}</b>`;
    }
    const x = Math.min(innerWidth - 226, Math.max(12, e.clientX - 107)), r = s.getBoundingClientRect();
    const y = r.top > 230 ? r.top - tip.offsetHeight - 12 : r.bottom + 12;
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
  });

  // ── 換色：畫面中線上的區塊決定整頁顏色 ──
  let zoneIO = null, bigIO = null;
  function unwatch() { [zoneIO, bigIO].forEach(o => o && o.disconnect()); zoneIO = bigIO = null; }

    unwatch();

      if (!e.isIntersecting || !curGroup) return;

      if (t.id === 'p-head') setTheme(PAPER);
      else if (t.id === 'p-colophon') setTheme(DARK);
      else setTheme(themeFor(mainHex(g.photos[+t.dataset.i])));
    }), { rootMargin: '-50% 0px -50% 0px' });
    document.querySelectorAll('#p-head, .p-plate, #p-colophon').forEach(el => zoneIO.observe(el));
    // 小圖先載，接近視窗時若需要更大的圖再換
    bigIO = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; bigIO.unobserve(e.target);

    }), { rootMargin: '30% 0px 30% 0px' });

  }

  document.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('.p-card-photo'); if (!b || !curGroup) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); goPlate(Math.max(0, Math.min(curGroup.photos.length - 1, +b.dataset.pv + (e.key === 'ArrowRight' ? 1 : -1))));
  });

  return {
    // 進相簿：換上色譜的外觀
    enter(g, app) {
      curGroup = g;
      fonts.media = 'all';
      root.classList.add('pm');
      app.innerHTML = renderGroup(g);

      watch(g);
    },
    // 離開相簿：色譜改過的東西全部還原，歲時記的樣式回來
    leave() {
      curGroup = null; unwatch();
      root.classList.remove('pm');
      fonts.media = 'not all';

    },
  };
})();

// ══ 相簿頁：高級雜誌・何布版（magazine-hobu-edition） ══
// 版式、色碼、字級照風格本。頁面上的字全部來自資料，或是純功能性的標籤。
document.documentElement.classList.add('m-js');
const ROMAN = n => { let s = ''; for (const [v, r] of [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]) while (n >= v) { s += r; n -= v; } return s; };
const CN = n => n <= 10 ? NUMS[n - 1] : n < 20 ? '十' + NUMS[n - 11] : NUMS[Math.floor(n / 10) - 1] + '十' + (n % 10 ? NUMS[n % 10 - 1] : '');
const dot = d => String(d || '').replace(/-/g, '.');
const cnDate = d => { const [, m, dd] = d.split('-'); return `${CN(+m)}月${CN(+dd)}日`; };
const isLatin = s => /^[\x20-\x7e]+$/.test(s);
// 算字數用來縮放大標題：中文字算 1，英數算 0.55
const len = s => Math.max(1, [...String(s)].reduce((n, c) => n + (c.charCodeAt(0) < 128 ? .55 : 1), 0)).toFixed(2);
const range = (a, b) => pad(a + 1) + (b !== a ? '–' + pad(b + 1) : '');
const M_THEME = ['paper', 'char', 'warm', 'mist'];
// 開章色塊：四季各配一色，主題系列輪著用。這個配法是暫定的，可以換。
const M_BLOCK = { harugasumi: 'moss', aoarashi: 'indigo', kouyou: 'brick', yukiakari: 'ink', kaiyou: 'indigo', sansui: 'moss', street: 'ink', xpan: 'indigo', ginen: 'ink', lisbon: 'brick', singapore: 'moss' };
// 攝影誌的章：前四章照風格本的順序，磚紅只出現一次
const chapterBlock = i => i < 4 ? ['moss', 'ink', 'brick', 'indigo'][i] : ['moss', 'ink', 'indigo'][(i - 4) % 3];

function mImg(p, sizes, eager) {
  const s = PS.url(p.s), l = PS.url(p.l);
  // 攝影誌的大圖是小圖的兩倍寬；系列只有一個尺寸
  const set = p.l !== p.s && sizes ? ` srcset="${s} ${p.w}w, ${l} ${p.w * 2}w" sizes="${sizes}"` : '';
  return `<img src="${s}"${set} width="${p.w}" height="${p.h}" alt="${E(PS.caption(p))}" loading="${eager ? 'eager' : 'lazy'}" decoding="async" draggable="false">`;
}
function mFig(p, i, cap, o = {}) {
  const name = PS.caption(p);
  return `<figure class="m-ph${o.still ? '' : ' m-rv'}${o.cls ? ' ' + o.cls : ''}" style="--r:${ratio(p)}">`
    + `<button class="m-btn" type="button" data-pv="${i}" aria-label="放大 作品 ${pad(i + 1)}${name ? '：' + E(name) : ''}">${mImg(p, o.sizes, o.eager)}</button>`
    + `<figcaption class="m-cap">${cap}</figcaption></figure>`;
}
function mCapSeries(p, i) {
  const h = String(p.haiku || '').replace(/／/g, '　');
  return `<span class="l"><b>${pad(i + 1)}</b><span>${E(p.title)}</span>${h ? `<span class="hk">${E(h)}</span>` : ''}</span>${p.year ? `<span class="yy">${E(p.year)}</span>` : ''}`;
}
function mCapJournal(p, i) {
  return `<span class="l"><b>${pad(i + 1)}</b><span>${E(p.title || p.place || '')}</span></span><time datetime="${E(p.date)}">${dot(p.date)}</time>`;
}
function mOpener(o) {
  return `<section class="m-sec mt-${o.theme} m-opener ${o.side}" id="${o.id}" aria-label="${E(o.title)}">
    <div class="m-block mb-${o.blk}">
      <p class="m-kick"><span class="m-r">${o.roman}</span><span class="m-k">${E(o.kick)}</span></p>
      <${o.h} class="m-title${isLatin(o.title) ? ' lat' : ''}" style="--n:${len(o.title)}">${E(o.title)}</${o.h}>
      <div class="m-meta">${o.meta}<p class="m-run" aria-hidden="true">${E(o.run)}</p></div>
    </div>
    <div class="m-op-photo">${mFig(cur[o.i], o.i, o.cap, { eager: o.eager, still: o.eager, sizes: '(max-width: 900px) 100vw, 64vw' })}<p class="m-op-pg" aria-hidden="true">${E(o.pgLabel)}<b class="m-pg">${pad(o.pg)}</b></p></div>
  </section>`;
}
// 開章之後的版面：滿版、雙聯、單張、錯落輪流。超寬的照片不跟別張並排。
function mPages(idx, themeOf, runL, runR, st) {
  const seq = ['full', 'dip', 'single', 'stag']; let k = 0, html = '';
  while (k < idx.length) {
    const a = idx[k], b = idx[k + 1], pa = cur[a], pb = b !== undefined ? cur[b] : null;
    let type = seq[st.t % 4];
    if (wide(pa)) type = (st.w++ % 2) ? 'single' : 'full';
    else { if ((type === 'dip' || type === 'stag') && (!pb || wide(pb))) type = 'single'; st.t++; }
    const theme = themeOf(st.n++), two = type === 'dip' || type === 'stag', pg = ++st.pg;
    const folio = `<div class="m-folio" aria-hidden="true"><span>${E(runL)}</span><span>${E(runR)}<b class="m-pg">${pad(pg)}</b></span></div>`;
    const label = `作品 ${pad(a + 1)}${two ? '、' + pad(b + 1) : ''}`;
    const head = `<section class="m-sec mt-${theme} m-${type}${type === 'full' && wide(pa) ? ' wide' : ''}" aria-label="${label}">`;
    if (type === 'full') html += `${head}${mFig(pa, a, st.cap(pa, a), { sizes: '(max-width: 700px) 100vw, 88vw' })}</section>`;
    else if (type === 'single') html += `${head}${mFig(pa, a, st.cap(pa, a), { sizes: '(max-width: 700px) 100vw, 72vw' })}${folio}</section>`;
    else if (type === 'dip') html += `${head}<div class="m-dip-row" style="--sum:${(pa.w / pa.h + pb.w / pb.h).toFixed(4)}">${mFig(pa, a, st.cap(pa, a), { sizes: '(max-width: 700px) 100vw, 46vw' })}${mFig(pb, b, st.cap(pb, b), { sizes: '(max-width: 700px) 100vw, 46vw' })}</div>${folio}</section>`;
    else html += `${head}<div class="m-stag-row">${mFig(pa, a, st.cap(pa, a), { cls: 'a', sizes: '(max-width: 700px) 100vw, 46vw' })}${mFig(pb, b, st.cap(pb, b), { cls: 'b', sizes: '(max-width: 700px) 100vw, 40vw' })}</div>${folio}</section>`;
    k += two ? 2 : 1;
  }
  return html;
}
function mCredits(sub, head, rows) {
  return `<section class="m-sec mt-paper m-credits" id="m-credits" aria-label="作品資料"><div class="m-cr-head"><h2>作品資料</h2><p>${E(sub)}</p></div>`
    + `<table class="m-cr"><thead>${head}</thead><tbody>${rows}</tbody></table></section>`;
}
function mEnd(prev, next, hrefOf, nameOf, labels) {
  const item = (g, l, cls) => g ? `<a class="${cls}" href="${hrefOf(g)}"><small>${l}</small><b>${E(nameOf(g))}</b></a>` : `<span class="${cls}"></span>`;
  return `<nav class="m-end" aria-label="前後">${item(prev, labels[0], 'p')}<a class="c" href="#/">目次</a>${item(next, labels[1], 'n')}</nav>`;
}

// ── 系列頁：一個色塊開章，之後一頁一頁翻 ──
function renderSeries(s) {
  cur = s.photos;
  const isJ = isJournal(s), isSeason = s.kind === 'season';
  const all = isJ ? JOURNALS : SERIES, k = all.indexOf(s);
  const si = (isJ ? JOURNALS : isSeason ? PS.seasons : THEMES).indexOf(s);
  const st = { t: 0, w: 0, n: 0, pg: 1, cap: mCapSeries };
  const opener = mOpener({ id: 'm-top', h: 'h1', theme: 'paper', side: 'L', blk: M_BLOCK[s.id] || 'moss', roman: ROMAN(si + 1),
    kick: `${isJ ? '攝影誌' : isSeason ? '卷' + NUMS[si] : '別卷'}　${s.short}`, title: s.name,
    meta: `<p>${E(s.latin)}</p><p><span class="lbl">作品</span>${range(0, cur.length - 1)}</p>`, run: PS.site.name,
    i: 0, cap: mCapSeries(cur[0], 0), pgLabel: s.name, pg: 1, eager: true });
  const pages = mPages(cur.map((_, i) => i).slice(1), n => M_THEME[Math.floor(n / 4) % 4], PS.site.name, s.name, st);
  const hasYear = cur.some(p => p.year);
  const rows = cur.map((p, i) => `<tr><td class="no">${pad(i + 1)}</td><td class="ti">${E(p.title)}</td><td class="hk">${E(String(p.haiku || '').replace(/／/g, '　'))}</td>${hasYear ? `<td class="yy nw">${E(p.year || '')}</td>` : ''}</tr>`).join('');
  const credits = mCredits(`${s.count} 張`, `<tr><th>編號</th><th>名稱</th><th>短句</th>${hasYear ? '<th>年份</th>' : ''}</tr>`, rows);
  app.innerHTML = `<div class="m-album series">${opener}${pages}${credits}${mEnd(all[k - 1], all[k + 1], g => `#/${isJ ? 'journal' : 'series'}/${g.id}`, g => g.name, isJ ? ['上一冊', '下一冊'] : ['前卷', '次卷'])}</div>`;
  ctx.textContent = `${s.name}　${s.count} 張`;
}

// ── 照日期分章的攝影誌頁：封面加目錄，每章一個色塊開章 ──
// 目前沒有用到（現在的攝影誌是 Lisbon 和 Singapore，沒有日期，走上面的系列頁）。留給以後有日期的攝影誌。
function renderJournal(j) {
  cur = j.photos;
  const J = JOURNALS, k = J.indexOf(j), ch = [];
  // 旅行與月誌照日期分章；攝影集的順序不照日期，改照地點分章
  const keyOf = p => j.kind === 'book' ? (p.place || '') : p.date;
  cur.forEach((p, i) => { const last = ch[ch.length - 1]; if (last && last.key === keyOf(p)) last.idx.push(i); else ch.push({ key: keyOf(p), date: p.date, idx: [i] }); });
  ch.forEach(c => {
    const pl = [...new Set(c.idx.map(i => cur[i].place))]; c.place = pl.length === 1 ? pl[0] : '';
    const ds = c.idx.map(i => cur[i].date).sort(); c.d0 = ds[0]; c.d1 = ds[ds.length - 1];
    const same = c.d0.slice(0, 4) === c.d1.slice(0, 4);
    c.span = c.d0 === c.d1 ? dot(c.d0) : `${dot(c.d0)}–${same ? dot(c.d1).slice(5) : dot(c.d1)}`;
    c.short = c.d0 === c.d1 ? dot(c.d0).slice(5) : same ? `${dot(c.d0).slice(5)}–${dot(c.d1).slice(5)}` : `${c.d0.slice(0, 4)}–${c.d1.slice(0, 4)}`;
  });
  // 每章的地點都有、而且互不相同，章名才用地點；不然用日期
  const byPlace = ch.every(c => c.place) && new Set(ch.map(c => c.place)).size === ch.length;
  const years = new Set(ch.map(c => c.date.slice(0, 4))).size > 1;
  ch.forEach(c => { c.title = byPlace ? c.place : c.d0 === c.d1 ? cnDate(c.date) : j.title; });
  const monthly = j.kind === 'monthly', [yy, mm] = String(j.when).split('.');
  const giant = monthly ? `${CN(+mm)}月` : j.title, yline = monthly ? yy : j.when;
  const run = `${monthly ? j.title.split(' ')[0] : j.title}　${j.when}`;
  const row = (jump, r, t, d, n) => `<li><button type="button" data-jump="${jump}"><span class="r">${r}</span><span class="t">${E(t)}</span><span class="d">${d}</span><span class="n">${n}</span></button></li>`;
  const toc = ch.map((c, i) => row(`m-ch${i + 1}`, ROMAN(i + 1), c.title, byPlace ? c.short : years ? c.date.slice(0, 4) : '', range(c.idx[0], c.idx[c.idx.length - 1]))).join('')
    + row('m-credits', '', '作品資料', '', range(0, cur.length - 1));
  const ci = j.cover || 0, c0 = cur[ci], cw = c0.w / c0.h >= 2.2;
  const cover = `<section class="m-sec mt-paper m-cover ${cw ? 'wide' : 'side'}" id="m-top" aria-label="封面">
    ${mFig(c0, ci, mCapJournal(c0, ci), { eager: true, still: true, sizes: cw ? '100vw' : '(max-width: 900px) 100vw, 56vw' })}
    <div class="m-cover-type"><h1 class="m-month" style="--n:${len(giant)}"><span class="m-month-y">${E(yline)}</span>${E(giant)}</h1>
    <nav class="m-contents" aria-label="目錄"><p class="m-contents-h"><span>目錄</span><span>${KIND[j.kind] || ''}　${j.count} 張</span></p><ol>${toc}</ol></nav></div></section>`;
  const st = { t: 0, w: 0, n: 0, pg: 0, cap: mCapJournal };
  let html = '';
  ch.forEach((c, i) => {
    const a = c.idx[0], b = c.idx[c.idx.length - 1], theme = M_THEME[i % 4];
    html += mOpener({ id: `m-ch${i + 1}`, h: 'h2', theme, side: i % 2 ? 'R' : 'L', blk: chapterBlock(i), roman: ROMAN(i + 1), kick: `第${CN(i + 1)}章`, title: c.title,
      meta: `<p><span class="lbl">日期</span>${c.span}</p>${c.place && !byPlace ? `<p><span class="lbl">地點</span>${E(c.place)}</p>` : ''}<p><span class="lbl">作品</span>${range(a, b)}</p>`,
      run, i: a, cap: mCapJournal(cur[a], a), pgLabel: c.title, pg: ++st.pg, eager: false });
    html += mPages(c.idx.slice(1), () => theme, run, c.title, st);
  });
  const hasT = cur.some(p => p.title), hasP = cur.some(p => p.place), hasM = cur.some(p => p.meta);
  const cols = 2 + hasT + hasP + hasM;
  const rows = ch.map((c, i) => `<tr class="grp"><th colspan="${cols}" scope="colgroup"><span class="r">${ROMAN(i + 1)}</span>${E(c.title)}</th></tr>`
    + c.idx.map(x => { const p = cur[x]; return `<tr><td class="no">${pad(x + 1)}</td><td class="dt nw">${dot(p.date)}</td>${hasT ? `<td class="ti">${E(p.title)}</td>` : ''}${hasP ? `<td class="pl">${E(p.place)}</td>` : ''}${hasM ? `<td class="mt">${E(p.meta)}</td>` : ''}</tr>`; }).join('')).join('');
  const credits = mCredits(`${j.count} 張`, `<tr><th>編號</th><th>日期</th>${hasT ? '<th>名稱</th>' : ''}${hasP ? '<th>地點</th>' : ''}${hasM ? '<th>拍攝資料</th>' : ''}</tr>`, rows);
  app.innerHTML = `<div class="m-album journal">${cover}${html}${credits}${mEnd(J[k - 1], J[k + 1], g => `#/journal/${g.id}`, g => g.title, ['上一冊', '下一冊'])}</div>`;
  ctx.textContent = `${j.title}　${j.when}`;
}

// 目錄點了捲到那一章
app.addEventListener('click', e => {
  const b = e.target.closest('[data-jump]'); if (!b) return;
  const el = document.getElementById(b.dataset.jump);
  if (el) el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
});
// 照片捲進畫面時淡入一次
let mIO = null;
function mReveal() {
  if (mIO) { mIO.disconnect(); mIO = null; }
  const els = app.querySelectorAll('.m-rv'); if (!els.length) return;
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion:reduce)').matches) { els.forEach(x => x.classList.add('in')); return; }
  mIO = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); mIO.unobserve(en.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
  els.forEach(x => mIO.observe(x));
}

// ── 頁面切換 ──
let go = null;
document.querySelector('.topbar').addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (!a) return;
  e.preventDefault(); go = a.dataset.go;
  if (location.hash.replace(/^#\/?/, '') === '') jump(); else location.hash = '#/';
});
function jump() { const id = go; go = null; requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ block: 'start' }); }); }

PS.route(parts => {
  const [a, b] = parts, g = b && PS.group(b);
  // 舊的 #/journal/lisbon 這類網址：相簿已經拿掉、改成攝影集的，直接轉過去
  const book = a === 'journal' && !g && BOOKS.find(x => x.id === b);
  if (book) { location.replace(book.href); return; }
  // 首頁與攝影誌總覽是歲時記；相簿頁照 usePalette 分成色譜或高級雜誌
  const album = (a === 'series' || a === 'journal') && g && g.name ? g : null;
  const asPalette = !!album && usePalette(album), asMagazine = !!album && !asPalette;
  document.documentElement.classList.toggle('album', asMagazine);
  document.getElementById('m-fonts').media = asMagazine ? 'all' : 'not all';
  if (asPalette) { cur = g.photos; P.enter(g, app); ctx.textContent = `${g.name}　${g.count} 張`; }
  else { P.leave(); if (asMagazine) renderSeries(album); else if (a === 'journals') renderJournals(); else renderHome(); }
  document.querySelectorAll('.topbar nav a').forEach(x => x.removeAttribute('aria-current'));
  const navKey = a === 'journals' || (album && isJournal(album)) ? 'journals' : album && album.kind === 'theme' ? 'bekkan' : album ? 'shiki' : '';
  const on = document.querySelector(`.topbar [data-nav="${navKey}"],.topbar [data-go="${navKey}"]`);
  if (on) on.setAttribute('aria-current', 'true');
  if (go) jump();
  mReveal();
  document.documentElement.dataset.ready = 'true';
});
})();
</script>
</body>
</html>
