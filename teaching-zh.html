<style>
:root{color-scheme:light;--paper:#f5f5f5;--ink:#1d1d1d;--muted:#575757;--faint:#6b6b6b;--line:#c5c7c8;--accent:#1d1d1d;

body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.9 var(--serif);-webkit-font-smoothing:antialiased}

<script>
(function(){
  if (typeof courseData === 'undefined') return;
  var L = document.documentElement.lang === 'en' ? 'en' : 'zh';
  var S = L === 'en' ? 'syllabus.html' : 'syllabus-zh.html';
  document.querySelectorAll('.course-list[data-term]').forEach(function(box){
    var html = '';
    courseData.filter(function(c){ return c.term === box.getAttribute('data-term'); }).forEach(function(c){
      var href = S + '?course=' + c.id;
      var m = ['<b>' + c['level_' + L] + '</b>'];
      if (c.credits) m.push(c.credits + (L === 'en' ? ' credits' : ' 學分'));
      if (c['time_' + L]) m.push(c['time_' + L]);
      if (c['term_' + L]) m.push(c['term_' + L]);
      var body = c['tba_' + L] ? '<p class="tba">' + c['tba_' + L] + '</p>'
        : (c['desc_' + L] ? '<div class="d">' + c['desc_' + L].map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</div>' : '');
      html += '<article class="course"><div>'
        + '<div class="tag">' + c['tag_' + L] + '</div>'
        + '<h3><a href="' + href + '">' + c['title_' + L] + '</a></h3>'
        + '<div class="other">' + c['title_' + (L === 'en' ? 'zh' : 'en')] + '</div>'
        + '</div><div>'
        + '<p class="m">' + m.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</p>'
        + body
        + '<a class="go" href="' + href + '">' + (L === 'en' ? 'View Syllabus' : '查看大綱') + ' <span aria-hidden="true">→</span></a>'
        + '</div></article>';
    });
    box.innerHTML = html;
  });
  // 學期切換：網址 # 後面記住是哪一學期（#term-1142），重新整理或分享連結都停在同一學期
  var btns = [].slice.call(document.querySelectorAll('.terms button'));
  function show(id, push){
    if (!document.getElementById(id)) id = btns[0].getAttribute('aria-controls');
    btns.forEach(function(b){ var on = b.getAttribute('aria-controls') === id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    document.querySelectorAll('.term-panel').forEach(function(p){ p.hidden = p.id !== id; });
    if (push) history.replaceState(null, '', '#' + id);
  }
  btns.forEach(function(b, i){
    b.addEventListener('click', function(){ show(b.getAttribute('aria-controls'), true); });
    b.addEventListener('keydown', function(e){
      var k = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!k) return;
      var n = btns[(i + k + btns.length) % btns.length]; n.focus(); n.click(); e.preventDefault();
    });
  });
  show(location.hash.slice(1), false);
})();
</script>
